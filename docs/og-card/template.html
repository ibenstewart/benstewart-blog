<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Share card template</title>
<!--
  1200x630 Field manual share card. Light colours are set explicitly on
  purpose: no prefers-color-scheme rules, so a dark-mode Mac renders the same.

  Entry card:  template.html?t=<title>&n=<entry number>&c=<chapter label>&col=<theme colour>&q=<pull line>
  Site card:   template.html            (no parameters: the default card for pages)

  Every value is URL-encoded. `npm run og-cards` fills them in from the posts
  and renders every card (scripts/og-cards.mts); pass a slug to do just one.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Schibsted+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #F6F5F0;
    --ink: #0E0F12;
    --faint: #5C5F66;
    --accent: #003593;
    --hi: #FFD84A;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { position: relative; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; }

  .bar {
    position: absolute; inset: 0 0 auto 0; height: 92px; padding: 0 64px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 3px solid var(--ink);
  }
  .brand { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: center; gap: 14px; }
  .pill { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: 0.1em; background: var(--ink); color: var(--paper); border-radius: 6px; padding: 5px 10px; }
  .site { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--faint); letter-spacing: 0.02em; }

  .body { position: absolute; left: 64px; right: 64px; top: 95px; bottom: 22px; display: flex; align-items: center; }
  .row { display: flex; gap: 40px; align-items: flex-start; width: 100%; }
  .badge {
    flex: none; align-self: flex-start;
    font-family: var(--mono); font-weight: 700; font-size: 72px; line-height: 1; letter-spacing: -0.03em;
    background: var(--ink); color: var(--hi); border-radius: 24px; padding: 24px 28px;
  }
  .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .chapter { font-family: var(--mono); font-size: 20px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 12px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .title {
    margin-top: 18px;
    font-weight: 700; font-size: 96px; line-height: 0.96; letter-spacing: -0.045em; text-wrap: balance;
  }
  .quote { margin-top: 28px; max-width: 900px; font-size: 34px; font-weight: 500; line-height: 1.32; letter-spacing: -0.01em; }
  .quote span {
    background: linear-gradient(var(--hi), var(--hi)) 0 88% / 100% 42% no-repeat;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: var(--accent); }

  /* The site card: no number, a bigger line, the strapline highlighted. */
  body.site-card .badge, body.site-card .chapter { display: none; }
  body.site-card .title { font-size: 112px; margin-top: 0; }
  body.site-card .quote { font-size: 38px; }
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Ben Stewart <span class="pill">FIELD MANUAL</span></div>
  <div class="site">benstewart.ai</div>
</div>
<div class="body"><div class="row">
  <div class="badge" id="badge"></div>
  <div class="main">
    <div class="chapter"><span class="dot" id="dot"></span><span id="chapter"></span></div>
    <div class="title" id="title">Field reports from the AI transition.</div>
    <p class="quote" id="quote"><span>Leading engineering teams through AI, sorted by the problem in front of you.</span></p>
  </div>
</div></div>
<div class="foot"></div>
<script>
  var q = new URLSearchParams(location.search);
  var title = document.getElementById('title');
  var quote = document.getElementById('quote');
  if (!q.get('t')) {
    document.body.className = 'site-card';
  } else {
    title.textContent = q.get('t');
    document.getElementById('badge').textContent = q.get('n') || '';
    if (!q.get('n')) document.getElementById('badge').style.display = 'none';
    document.getElementById('chapter').textContent = q.get('c') || '';
    if (q.get('col')) document.getElementById('dot').style.background = q.get('col');
    if (q.get('q')) quote.firstElementChild.textContent = q.get('q');
    else quote.style.display = 'none';
  }
  // Once the fonts are in, shrink a long title, then a long pull line, until
  // both fit above the blue foot. The renderer waits for data-ready.
  function fits() {
    var lines = Math.round(title.offsetHeight / (parseFloat(getComputedStyle(title).fontSize) * 0.96));
    return lines <= 3 && document.querySelector('.row').offsetHeight <= 630 - 95 - 22 - 96;
  }
  document.fonts.ready.then(function () {
    if (document.body.className !== 'site-card') {
      var size = 96;
      while (!fits() && size > 56) { size -= 2; title.style.fontSize = size + 'px'; }
      var qs = 34;
      while (!fits() && qs > 24) { qs -= 1; quote.style.fontSize = qs + 'px'; }
    }
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
